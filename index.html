<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fantasy Football Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%234F2683'/%3E%3Ccircle cx='50' cy='50' r='35' fill='%23FFC62F'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F2683;
            --accent: #FFC62F;
            --success-green: #28a745;
            --danger-red: #dc3545;
            --bg-dark: #121212;
            --text-muted: #adb5bd;
            --text-light: #f8f9fa;
            --bg-secondary: #1f1f1f;
            --border-color: #343a40;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1640675320583-945fc580b87f?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            font-size: 1rem;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        header {
            background-color: var(--primary);
            color: var(--text-light);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        header .logo {
            height: 90px;
            width: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--accent), var(--primary));
            border: 3px solid var(--text-light);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        header .logo.placeholder {
            background-image: url('https://sleepercdn.com/images/v2/default_avatar-512x512.png');
            background-size: cover;
            background-position: center;
        }
        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            flex: 1;
            text-align: center;
        }
        #userInfo {
            font-size: 0.9rem;
            text-align: right;
            white-space: pre-line;
            max-width: 150px;
        }

        @media (max-width: 768px) {
            header h1 {
                display: none;
            }
            header {
                justify-content: space-between;
            }
            header .logo {
                height: 75px;
                width: 75px;
            }
            #userInfo {
                font-size: 0.85rem;
                max-width: none;
                text-align: center;
                flex: 1;
            }
        }

        .fetch-card {
            background-color: var(--bg-secondary);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin: 20px auto;
            max-width: 700px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .accordion-item {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .accordion-body {
            background-color: var(--bg-secondary);
            line-height: 1.6;
        }

        #leagues table {
            font-size: 0.9rem;
        }
        #leagues th, #leagues td {
            padding: 8px 10px;
            vertical-align: middle;
        }
        #leagues th {
            font-size: 0.9rem;
            background-color: rgba(0,0,0,0.5);
        }
        #leagues tr:hover {
            background-color: rgba(255,255,255,0.05);
        }

        @media (max-width: 768px) {
            #leagues table {
                display: none;
            }
            #leagues .league-card {
                display: block;
            }
            #leagues .controls-mobile {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-bottom: 15px;
                flex-wrap: wrap;
            }
            .league-card .league-details {
                gap: 8px;
            }
        }

        .league-card {
            background-color: rgba(31,31,31,0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .league-card .league-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }
        .league-card .league-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .league-card .detail-item {
            flex: 1;
            min-width: 120px;
        }
        .league-card .paid-section {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .clickable-link {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .clickable-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px var(--accent);
        }

        .badge.bg-success {
            background-color: var(--success-green) !important;
            color: white !important;
        }
        .badge.bg-danger {
            background-color: var(--danger-red) !important;
            color: white !important;
        }
        .badge.bg-warning {
            background-color: #FFC107 !important;
            color: #212529 !important;
        }
        .badge.bg-info {
            background-color: #17a2b8 !important;
            color: white !important;
        }
        .badge.bg-primary {
            background-color: var(--primary) !important;
            color: white !important;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--accent));
            border: none;
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 38, 131, 0.4);
        }

        .accordion-button {
            background-color: rgba(0,0,0,0.5);
            color: var(--text-light);
        }
        .accordion-button:not(.collapsed) {
            background-color: var(--accent);
            color: #212529;
        }

        .custom-paid-switch .form-check-input {
            background-color: var(--danger-red);
            border-color: var(--danger-red);
            width: 2.2em;
            height: 1.1em;
        }
        .custom-paid-switch .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .small-note {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .ktc-player-rank, .fp-player-rank {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
        }
        .roster-player-item {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .roster-player-item img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            object-fit: cover;
            border-radius: 50%;
        }
        .roster-player-info {
            flex-grow: 1;
            min-width: 0;
        }
        .roster-player-info strong {
            display: block;
            font-size: 0.95rem;
        }
        .roster-player-info small {
            font-size: 0.8rem;
        }
        .roster-stats {
            text-align: right;
            font-size: 0.85rem;
            line-height: 1.2;
        }
        .roster-stats .ranks-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        .roster-stats .points-block {
            text-align: right;
        }
    </style>
</head>
<body>
    <header>
        <div id="userAvatar" class="logo placeholder"></div>
        <h1>FFAddict.com Dashboard</h1>
        <div id="userInfo"></div>
    </header>

    <div class="container my-4">
        <div class="fetch-card">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="username" class="form-label">Sleeper Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username">
                </div>
                <div class="col-12 col-md-4">
                    <label for="season" class="form-label">Season Year</label>
                    <input type="text" id="season" class="form-control" value="2025" placeholder="e.g. 2025">
                </div>
                <div class="col-12 col-md-4">
                    <button id="fetchBtn" class="btn btn-primary w-100">Load / Refresh My Data</button>
                </div>
            </div>
            <div class="loader mt-3" id="loader" style="display:none;">
                <div class="spinner-border spinner-border-sm" role="status"></div> Loading your leagues...
            </div>
            <div id="errorMessage" class="alert alert-danger mt-3" style="display:none;"></div>
        </div>

        <div class="accordion" id="dashboardAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button id="leaguesButton" class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseLeagues">
                        <i class="bi bi-trophy me-3"></i> Your Leagues
                    </button>
                </h2>
                <div id="collapseLeagues" class="accordion-collapse collapse show" data-bs-parent="#dashboardAccordion">
                    <div class="accordion-body" id="leagues"></div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePlayers">
                        <i class="bi bi-person-badge me-3"></i> Your Players
                    </button>
                </h2>
                <div id="collapsePlayers" class="accordion-collapse collapse" data-bs-parent="#dashboardAccordion">
                    <div class="accordion-body" id="players"></div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTrades">
                        <i class="bi bi-arrow-left-right me-3"></i> Your Trades
                    </button>
                </h2>
                <div id="collapseTrades" class="accordion-collapse collapse" data-bs-parent="#dashboardAccordion">
                    <div class="accordion-body">
                        <div class="trade-controls">
                            <div class="trade-filter">
                                <label for="leagueFilter" class="form-label">Filter by League</label>
                                <select id="leagueFilter" class="form-select">
                                    <option value="all">All Leagues</option>
                                </select>
                            </div>
                            <div class="trade-search">
                                <label for="tradeSearch" class="form-label">Search Traded Players</label>
                                <input type="text" id="tradeSearch" class="form-control" placeholder="Type a player name...">
                            </div>
                        </div>
                        <div id="trades"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiBase = 'https://api.sleeper.app/v1';
        const cdnBase = 'https://sleepercdn.com/avatars/';
        const playerHeadshotBase = 'https://sleepercdn.com/images/v1/player_heads/';
        let playersMap = {};
        let statsMap = {};
        let userId = null;
        let allTradeItems = [];
        let leagueRosters = {};
        let rosterOwnerMap = {};
        let leagueStandings = [];
        let originalLeagueStandings = [];
        let allPlayerEntries = [];
        let rawTradesData = [];
        let totalLeaguesCount = 0;
        const PAGE_SIZE = 15;
        let currentPage = 0;
        const avatarContainer = document.getElementById('userAvatar');
        const faviconLink = document.getElementById('favicon');
        const errorMessage = document.getElementById('errorMessage');
        const leagueFilter = document.getElementById('leagueFilter');
        const userInfo = document.getElementById('userInfo');
        const cacheMap = new Map();

        let db = null;
        const DB_NAME = 'FFDashboardDB';
        const DB_VERSION = 2;
        const STORE_NAME_STATUS = 'statuses';
        const STORE_NAME_DATA = 'dashboard_data';

        function openDB() {
            return new Promise((resolve, reject) => {
                if (db) return resolve(db);
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME_STATUS)) db.createObjectStore(STORE_NAME_STATUS);
                    if (!db.objectStoreNames.contains(STORE_NAME_DATA)) db.createObjectStore(STORE_NAME_DATA);
                };
                request.onsuccess = (event) => { db = event.target.result; resolve(db); };
                request.onerror = () => reject(request.error);
            });
        }

        async function getPaidStatuses() {
            try {
                await openDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME_STATUS, 'readonly');
                    const store = tx.objectStore(STORE_NAME_STATUS);
                    const req = store.get('paid_statuses');
                    req.onsuccess = () => resolve(req.result || {});
                    req.onerror = () => resolve(JSON.parse(localStorage.getItem('ff_paid_statuses') || '{}'));
                });
            } catch {
                return JSON.parse(localStorage.getItem('ff_paid_statuses') || '{}');
            }
        }

        async function savePaidStatuses(statuses) {
            localStorage.setItem('ff_paid_statuses', JSON.stringify(statuses));
            try {
                await openDB();
                const tx = db.transaction(STORE_NAME_STATUS, 'readwrite');
                tx.objectStore(STORE_NAME_STATUS).put(statuses, 'paid_statuses');
            } catch {}
        }

        async function saveDashboardData(data) {
            try {
                await openDB();
                const tx = db.transaction(STORE_NAME_DATA, 'readwrite');
                tx.objectStore(STORE_NAME_DATA).put(data, 'current_data');
            } catch {}
        }

        async function loadDashboardData() {
            try {
                await openDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME_DATA, 'readonly');
                    const store = tx.objectStore(STORE_NAME_DATA);
                    const req = store.get('current_data');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch {
                return null;
            }
        }

        async function cachedFetch(url, expiryMs = 600000) {
            const now = Date.now();
            if (cacheMap.has(url) && cacheMap.get(url).expiry > now) return cacheMap.get(url).data;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                cacheMap.set(url, { data, expiry: now + expiryMs });
                return data;
            } catch (err) {
                throw err;
            }
        }

        let ktcPlayerMap = {};
        let fpPlayerMap = {};

        async function loadKTCValues() {
            ktcPlayerMap = {};
            const proxy = 'https://api.allorigins.win/raw?url=';
            let page = 1;
            let added = 0;
            const maxPages = 10;
            while (page <= maxPages) {
                const baseUrl = `https://keeptradecut.com/dynasty-rankings?page=${page}`;
                const fullUrl = proxy + encodeURIComponent(baseUrl);
                try {
                    const res = await fetch(fullUrl);
                    if (!res.ok) break;
                    const text = await res.text();
                    if (text.length < 5000 || text.includes('404')) break;
                    const doc = new DOMParser().parseFromString(text, 'text/html');
                    const rows = doc.querySelectorAll('tbody tr');
                    if (rows.length === 0) break;
                    for (let row of rows) {
                        const cells = row.querySelectorAll('td');
                        if (cells.length < 6) continue;
                        const rank = parseInt(cells[0].textContent.trim(), 10);
                        const link = cells[1].querySelector('a');
                        if (!link) continue;
                        let name = link.textContent.trim();
                        name = name.replace(/\s*\(.*\)$/g, '').trim(); // Remove parentheticals like (RB - COLLEGE)
                        const normalizedName = name.replace(/Jr\.?|Sr\.?|II|III|IV|\s*(QB|RB|WR|TE|K|DST).*/gi, '').replace(/[\s\.]/g, '').trim().toLowerCase();
                        ktcPlayerMap[normalizedName] = { rank };
                        added++;
                    }
                    page++;
                } catch (e) {
                    console.error('KTC fetch error on page ' + page, e);
                    break;
                }
            }
            console.log(`Loaded ${added} KTC player ranks`);
        }

        async function loadFPValues() {
            fpPlayerMap = {};
            const proxy = 'https://api.allorigins.win/raw?url=';
            const baseUrl = 'https://www.fantasypros.com/nfl/rankings/dynasty-superflex.php';
            const fullUrl = proxy + encodeURIComponent(baseUrl);
            try {
                const res = await fetch(fullUrl);
                if (!res.ok) {
                    console.warn(`FantasyPros fetch failed: ${res.status}`);
                    return;
                }
                const text = await res.text();
                const doc = new DOMParser().parseFromString(text, 'text/html');
                const rows = doc.querySelectorAll('#data tbody tr');
                if (rows.length === 0) return;
                for (let row of rows) {
                    const rankCell = row.querySelector('td:first-child');
                    if (!rankCell) continue;
                    const rank = parseInt(rankCell.textContent.trim(), 10);
                    if (isNaN(rank)) continue;
                    const playerLink = row.querySelector('td:nth-child(3) a.player-name');
                    if (!playerLink) continue;
                    let name = playerLink.textContent.trim();
                    name = name.replace(/\s*\(.*\)$/g, '').trim(); // Remove parentheticals like (RB - COLLEGE)
                    const normalizedName = name.replace(/Jr\.?|Sr\.?|II|III|IV|\s*(QB|RB|WR|TE|K|DST).*/gi, '').replace(/[\s\.]/g, '').trim().toLowerCase();
                    fpPlayerMap[normalizedName] = rank;
                }
                console.log(`Loaded ${Object.keys(fpPlayerMap).length} FantasyPros Superflex player ranks`);
            } catch (e) {
                console.error('FantasyPros fetch error', e);
            }
        }

        function formatDate(ts) {
            if (!ts || ts === 0) return 'Unknown';
            return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        (async () => {
            const saved = await loadDashboardData();
            if (saved) {
                playersMap = saved.playersMap || {};
                statsMap = saved.statsMap || {};
                leagueStandings = saved.leagueStandings || [];
                originalLeagueStandings = [...leagueStandings];
                leagueRosters = saved.leagueRosters || {};
                rosterOwnerMap = saved.rosterOwnerMap || {};
                allPlayerEntries = saved.allPlayerEntries || [];
                rawTradesData = saved.rawTrades || [];
                userId = saved.userId || null;
                ktcPlayerMap = saved.ktcPlayerMap || {};
                fpPlayerMap = saved.fpPlayerMap || {};
                totalLeaguesCount = saved.totalLeaguesCount || 0;

                document.getElementById('username').value = saved.username || '';
                document.getElementById('season').value = saved.season || '2025';

                if (saved.avatarUrl) {
                    avatarContainer.style.backgroundImage = `url(${saved.avatarUrl})`;
                    faviconLink.href = saved.avatarUrl;
                }
                userInfo.innerHTML = saved.userInfoHtml || '';

                document.getElementById('leaguesButton').innerHTML = `<i class="bi bi-trophy me-3"></i> Your Leagues (${leagueStandings.length})`;

                leagueFilter.innerHTML = '<option value="all">All Leagues</option>';
                [...new Set(Object.keys(leagueRosters))].sort().forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    leagueFilter.appendChild(opt);
                });

                displayLeagues(leagueStandings);
                displayPlayersPage();
                displayTrades(rawTradesData);

                document.body.classList.add('loaded');
            }
        })();

        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const season = document.getElementById('season').value.trim();
            if (!username || !season) return alert('Please enter your Sleeper username and season year.');

            document.getElementById('loader').style.display = 'block';
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
            clearSections();

            try {
                const userRes = await cachedFetch(`${apiBase}/user/${encodeURIComponent(username)}`);
                userId = userRes.user_id;

                const avatarUrl = userRes.avatar ? `${cdnBase}${userRes.avatar}` : null;
                if (avatarUrl) {
                    avatarContainer.style.backgroundImage = `url(${avatarUrl})`;
                    faviconLink.href = avatarUrl;
                } else {
                    avatarContainer.style.backgroundImage = 'none';
                }

                let earliestYear = parseInt(season);
                let year = earliestYear - 1;
                while (year >= 2015) {
                    try {
                        const testRes = await cachedFetch(`${apiBase}/user/${userId}/leagues/nfl/${year}`);
                        if (testRes.length > 0) earliestYear = year;
                        else break;
                    } catch { break; }
                    year--;
                }

                let totalWins = 0, totalLosses = 0, totalTies = 0;

                playersMap = await cachedFetch(`${apiBase}/players/nfl`);

                try { statsMap = await cachedFetch(`${apiBase}/stats/nfl/regular/${season}`); } catch { statsMap = {}; }

                await loadKTCValues();
                await loadFPValues();

                const leagues = await cachedFetch(`${apiBase}/user/${userId}/leagues/nfl/${season}`);

                totalLeaguesCount = leagues.length;

                document.getElementById('leaguesButton').innerHTML = `<i class="bi bi-trophy me-3"></i> Your Leagues (${leagues.length})`;

                const playerCountMap = {};
                const rawTrades = [];

                await Promise.all(leagues.map(async (league) => {
                    const leagueId = league.league_id;
                    const rosters = await cachedFetch(`${apiBase}/league/${leagueId}/rosters`);

                    rosterOwnerMap[leagueId] = {};
                    await Promise.all(rosters.map(async (r) => {
                        if (r.owner_id) {
                            const ownerData = await cachedFetch(`${apiBase}/user/${r.owner_id}`);
                            rosterOwnerMap[leagueId][r.roster_id] = {
                                display_name: r.metadata?.team_name || ownerData.display_name || ownerData.username || 'Unknown',
                                username: ownerData.username || 'Unknown'
                            };
                        }
                    }));

                    const userRoster = rosters.find(r => r.owner_id === userId);
                    if (!userRoster) return;

                    const userPlayers = [...(userRoster.players || []), ...(userRoster.taxi || []), ...(userRoster.reserve || [])];
                    leagueRosters[league.name] = userPlayers;

                    userPlayers.forEach(pId => playerCountMap[pId] = (playerCountMap[pId] || 0) + 1);

                    const wins = userRoster.settings?.wins || 0;
                    const losses = userRoster.settings?.losses || 0;
                    const ties = userRoster.settings?.ties || 0;
                    totalWins += wins;
                    totalLosses += losses;
                    totalTies += ties;

                    const pf_raw = (userRoster.settings?.fpts || 0) + (userRoster.settings?.fpts_decimal || 0) / 100 || 0;

                    const record = ties > 0 ? `${wins}-${losses}-${ties}` : `${wins}-${losses}`;

                    const sortedByPF = rosters.map(r => (r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100 || 0).sort((a, b) => b - a);
                    const pfRankNum = sortedByPF.findIndex(f => Math.abs(f - pf_raw) < 0.01) + 1;
                    const pfRank = `${pfRankNum}/${rosters.length}`;

                    const maxpf_raw = (userRoster.settings?.ppts ?? 0) + (userRoster.settings?.ppts_decimal ?? 0) / 100 || 0;

                    const sortedByMaxPF = rosters.map(r => (r.settings?.ppts ?? 0) + (r.settings?.ppts_decimal ?? 0) / 100 || 0).sort((a, b) => b - a);
                    const maxpfRankNum = sortedByMaxPF.findIndex(f => Math.abs(f - maxpf_raw) < 0.01) + 1;
                    const maxpfRank = `${maxpfRankNum}/${rosters.length}`;

                    let totalAge = 0;
                    let ageCount = 0;
                    userPlayers.forEach(pId => {
                        const age = playersMap[pId]?.age;
                        if (age != null && typeof age === 'number') {
                            totalAge += age;
                            ageCount++;
                        }
                    });
                    const avgAge = ageCount > 0 ? (totalAge / ageCount).toFixed(1) : 'N/A';

                    leagueStandings.push({ 
                        name: league.name, 
                        teams: rosters.length, 
                        record, 
                        pfRankNum, 
                        pfRank, 
                        maxpfRankNum,
                        maxpfRank,
                        avgAge,
                        leagueId, 
                        scoring: league.scoring_settings 
                    });

                    for (let week = 18; week >= 1; week--) {
                        try {
                            const transactions = await cachedFetch(`${apiBase}/league/${leagueId}/transactions/${week}`);
                            transactions.filter(t => t.type === 'trade' && t.roster_ids?.includes(userRoster.roster_id)).forEach(trade => {
                                rawTrades.push({ league: league.name, week, trade, userRosterId: userRoster.roster_id, leagueId, created: trade.created || 0 });
                            });
                        } catch {}
                    }

                    try {
                        const tradedPicks = await cachedFetch(`${apiBase}/league/${leagueId}/traded_picks`);
                        const userTradedPicks = tradedPicks.filter(p => p.owner_id === userRoster.roster_id || p.previous_owner_id === userRoster.roster_id);
                        if (userTradedPicks.length > 0) {
                            rawTrades.push({ league: league.name, tradedPicks: userTradedPicks, leagueId, userRosterId: userRoster.roster_id, created: 0 });
                        }
                    } catch {}
                }));

                const overallRecord = totalTies > 0 ? `${totalWins}-${totalLosses}-${totalTies}` : `${totalWins}-${totalLosses}`;
                const userInfoHtml = `Overall Record: ${overallRecord}\nMember Since: ${earliestYear}`;
                userInfo.innerHTML = userInfoHtml;

                originalLeagueStandings = [...leagueStandings];

                allPlayerEntries = Object.entries(playerCountMap).map(([pId, shares]) => ({ pId, shares })).sort((a, b) => b.shares - a.shares);

                rawTradesData = rawTrades;

                leagueFilter.innerHTML = '<option value="all">All Leagues</option>';
                [...new Set(Object.keys(leagueRosters))].sort().forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    leagueFilter.appendChild(opt);
                });

                displayLeagues(leagueStandings);
                displayPlayersPage();
                displayTrades(rawTrades);

                await saveDashboardData({
                    username, season, playersMap, statsMap, leagueStandings: originalLeagueStandings,
                    leagueRosters, rosterOwnerMap, allPlayerEntries, rawTrades: rawTradesData,
                    userId, avatarUrl, userInfoHtml, ktcPlayerMap, fpPlayerMap, totalLeaguesCount
                });

            } catch (error) {
                errorMessage.textContent = `Error: ${error.message || 'Unknown error'}. Check console for details.`;
                errorMessage.style.display = 'block';
                console.error(error);
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.body.classList.add('loaded');
            }
        });

                        const nameB = (playersMap[b.pId]?.full_name || '').toLowerCase();

                    case 'ktcRank':

                        const normB = (playersMap[b.pId]?.full_name || '').replace(/\s*\(.*\)$/g, '').replace(/Jr\.?|Sr\.?|II|III|IV|\s*(QB|RB|WR|TE|K|DST).*/gi, '').replace(/[\s\.]/g, '').trim().toLowerCase();
                        valA = ktcPlayerMap[normA]?.rank || 9999; valB = ktcPlayerMap[normB]?.rank || 9999; break;
                    case 'fpRank': 
                        const normFpA = (playersMap[a.pId]?.full_name || '').replace(/\s*\(.*\)$/g, '').replace(/Jr\.?|Sr\.?|II|III|IV|\s*(QB|RB|WR|TE|K|DST).*/gi, '').replace(/[\s\.]/g, '').trim().toLowerCase();
                        const normFpB = (playersMap[b.pId]?.full_name || '').replace(/\s*\(.*\)$/g, '').replace(/Jr\.?|Sr\.?|II|III|IV|\s*(QB|RB|WR|TE|K|DST).*/gi, '').replace(/[\s\.]/g, '').trim().toLowerCase();
                        valA = fpPlayerMap[normFpA] || 9999; valB = fpPlayerMap[normFpB] || 9999; break;

                }
                return (valA < valB ? -1 : valA > valB ? 1 : 0) * (playersSortDirection === 'asc' ? 1 : -1);

            }

        async function showRosterModal(leagueName) {
            const playerIds = leagueRosters[leagueName] || [];
            if (playerIds.length === 0) return alert('No roster data found for this league.');

            const standing = leagueStandings.find(l => l.name === leagueName);

            let statsHtml = '';
            if (standing) {
                statsHtml = `<div class="text-center mb-3">
                    <span class="me-2">Record: <span class="badge bg-success">${standing.record}</span></span>
                    <span class="me-2">PF Rank: <span class="badge bg-warning">${standing.pfRank}</span></span>
                    <span class="me-2">MaxPF Rank: <span class="badge bg-info">${standing.maxpfRank}</span></span>
                    <span class="me-2">Avg Age: <span class="badge bg-secondary">${standing.avgAge}</span></span>
                    <span class="text-muted">in ${standing.teams}-team league</span>
                </div>`;
            }

            const scoring = standing?.scoring || {};

            const groups = { QB: [], RB: [], WR: [], TE: [], Other: [] };
            playerIds.forEach(pId => {
                const player = playersMap[pId] || { full_name: 'Unknown Player', position: 'N/A', team: 'FA' };
                const pos = player.position || 'N/A';
                const group = groups[pos] || groups.Other;
                const playerStats = statsMap[pId] || {};

                let points = 0;
                for (let key in scoring) {
                    if (playerStats[key] !== undefined) points += (playerStats[key] || 0) * scoring[key];
                }

                const gp = playerStats.gp ?? 0;
                const ppg = gp > 0 ? (points / gp).toFixed(1) : '0.0';

                group.push({ ...player, pId, points, ppg });
            });

            let bodyHtml = statsHtml;
            ['QB', 'RB', 'WR', 'TE', 'Other'].forEach(pos => {
                let players = groups[pos];
                if (!players || players.length === 0) return;
                players.sort((a, b) => b.points - a.points);
                bodyHtml += `<div class="position-group mb-2"><div class="position-header text-primary fw-bold fs-6">${pos === 'Other' ? 'Bench / Taxi / IR' : pos}</div><div class="player-list">`;
                players.forEach(p => {
                    const name = p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim();
                    const normalizedName = name.replace(/\s*\(.*\)$/g, '').replace(/Jr\.?|Sr\.?|II|III|IV|\s*(QB|RB|WR|TE|K|DST).*/gi, '').replace(/[\s\.]/g, '').trim().toLowerCase();
                    const headshotUrl = `${playerHeadshotBase}${p.pId}.png`;
                    const ktcRank = ktcPlayerMap[normalizedName]?.rank || null;
                    const fpRank = fpPlayerMap[normalizedName] || null;
                    if (!ktcRank || !fpRank) {
                        console.log(`Roster modal rank match debug - Player: ${name}, Normalized: ${normalizedName}, KTC found: ${!!ktcPlayerMap[normalizedName]}, FP found: ${!!fpPlayerMap[normalizedName]}`);
                    }
                    bodyHtml += `<div class="roster-player-item">
                        <img src="${headshotUrl}" alt="${name}" onerror="this.style.display='none'">
                        <div class="roster-player-info">
                            <strong>${name}</strong>
                            <small>${p.team || 'FA'} • ${p.position || 'N/A'}</small>
                        </div>
                        <div class="roster-stats">
                            <div class="ranks-group">
                                ${ktcRank ? `<span class="ktc-player-rank">KTC #${ktcRank}</span>` : ''}
                                ${fpRank ? `<span class="fp-player-rank">FP #${fpRank}</span>` : ''}
                            </div>
                            <div class="points-block">
                                <div class="fw-bold text-success">${p.points.toFixed(1)}</div>
                                <small class="text-muted">${p.ppg} PPG</small>
                            </div>
                        </div>
                    </div>`;
                });
                bodyHtml += `</div></div>`;
            });

            const modalElem = document.createElement('div');
            modalElem.className = 'modal fade';
            modalElem.innerHTML = `<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content bg-dark text-light"><div class="modal-header border-0"><h5 class="modal-title">Roster — ${leagueName}</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body">${bodyHtml}</div><div class="modal-footer border-0"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button></div></div></div>`;
            document.body.appendChild(modalElem);
            const modal = new bootstrap.Modal(modalElem);
            modal.show();
            modalElem.addEventListener('hidden.bs.modal', () => modalElem.remove());
        }

        function showLeaguesForPlayerModal(pId) {
            const player = playersMap[pId] || { full_name: 'Unknown Player' };
            const name = player.full_name || `${player.first_name || ''} ${player.last_name || ''}`.trim();
            const leaguesWithPlayer = Object.keys(leagueRosters).filter(l => leagueRosters[l].includes(pId)).sort();

            let bodyHtml = '<ul class="list-unstyled">';
            leaguesWithPlayer.forEach(l => bodyHtml += `<li><span class="clickable-link" data-league="${l}">${l}</span></li>`);
            bodyHtml += '</ul>';
            if (leaguesWithPlayer.length === 0) bodyHtml = '<p class="text-muted">No leagues found with this player.</p>';

            const modalElem = document.createElement('div');
            modalElem.className = 'modal fade';
            modalElem.innerHTML = `<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content bg-dark text-light"><div class="modal-header border-0"><h5 class="modal-title">Leagues with ${name}</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body">${bodyHtml}</div><div class="modal-footer border-0"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button></div></div></div>`;
            document.body.appendChild(modalElem);
            const modal = new bootstrap.Modal(modalElem);
            modal.show();

            modalElem.querySelectorAll('.clickable-link').forEach(link => link.onclick = async (e) => {
                e.preventDefault();
                modal.hide();
                await showRosterModal(link.dataset.league);
            });

            modalElem.addEventListener('hidden.bs.modal', () => modalElem.remove());
        }

        function displayTrades(rawTrades) {
            const container = document.getElementById('trades');
            container.innerHTML = '';
            allTradeItems = [];

            if (rawTrades.length === 0) {
                container.innerHTML = '<p class="text-muted">No trades involving you this season.</p>';
                return;
            }

            rawTrades.sort((a, b) => (b.created || 0) - (a.created || 0) || (b.week || 0) - (a.week || 0));

            rawTrades.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-dark border border-secondary-subtle rounded-3 p-3 mb-3 trade-item shadow-sm';
                div.dataset.league = item.league;

                let tradedPlayers = [];

                if (item.trade) {
                    const { league, week, trade, userRosterId, leagueId, created } = item;
                    let received = [], sent = [], partnerUsername = 'Unknown';

                    const otherRosterId = trade.roster_ids.find(id => id !== userRosterId);
                    if (otherRosterId && rosterOwnerMap[leagueId] && rosterOwnerMap[leagueId][otherRosterId]) {
                        partnerUsername = rosterOwnerMap[leagueId][otherRosterId].username;
                    }

                    if (trade.adds) {
                        Object.keys(trade.adds).forEach(pId => {
                            if (trade.adds[pId] === userRosterId) {
                                const player = playersMap[pId] || { full_name: 'Unknown Player' };
                                const name = player.full_name || pId;
                                received.push({ name, pId });
                                tradedPlayers.push(name.toLowerCase());
                            }
                        });
                    }

                    if (trade.drops) {
                        Object.keys(trade.drops).forEach(pId => {
                            if (trade.drops[pId] === userRosterId) {
                                const player = playersMap[pId] || { full_name: 'Unknown Player' };
                                const name = player.full_name || pId;
                                sent.push({ name, pId });
                                tradedPlayers.push(name.toLowerCase());
                            }
                        });
                    }

                    let picksHtml = '';
                    if (trade.draft_picks) {
                        trade.draft_picks.forEach(pick => {
                            const direction = pick.owner_id === userRosterId ? 'Received' : 'Sent';
                            picksHtml += `<li><strong>${direction} Pick:</strong> ${pick.season} Round ${pick.round}</li>`;
                        });
                    }

                    const dateStr = formatDate(created);

                    let html = `<div class="mb-2"><span class="badge bg-primary">${league}</span><span class="badge bg-secondary ms-2">Week ${week}</span><span class="badge bg-dark ms-2">Partner: ${partnerUsername}</span><span class="badge bg-info ms-2">${dateStr}</span></div><ul class="mb-0">`;
                    received.forEach(({ name, pId }) => html += `<li class="text-success"><img src="${playerHeadshotBase}${pId}.png" alt="${name}" class="me-2 rounded-circle" style="width:24px;height:24px;" onerror="this.style.display='none'"><strong>Received:</strong> ${name}</li>`);
                    sent.forEach(({ name, pId }) => html += `<li class="text-danger"><img src="${playerHeadshotBase}${pId}.png" alt="${name}" class="me-2 rounded-circle" style="width:24px;height:24px;" onerror="this.style.display='none'"><strong>Sent:</strong> ${name}</li>`);
                    if (received.length === 0 && sent.length === 0) html += '<li class="text-muted">No player movement for you</li>';
                    html += picksHtml + '</ul>';

                    div.innerHTML = html;
                } else if (item.tradedPicks) {
                    let header = `<div class="mb-3"><span class="badge bg-primary">${item.league}</span><strong class="ms-2"> Traded Draft Picks</strong><span class="badge bg-info ms-2">Date Unknown</span></div>`;
                    let tableHtml = `<table class="table table-sm table-dark table-responsive"><thead><tr><th>Season</th><th>Round</th><th>Original</th><th>Current</th><th>Direction</th></tr></thead><tbody>`;
                    item.tradedPicks.forEach(p => {
                        const direction = p.owner_id === item.userRosterId ? 'Received' : 'Sent';
                        tableHtml += `<tr><td>${p.season}</td><td>${p.round}</td><td>${rosterOwnerMap[item.leagueId]?.[p.previous_owner_id]?.display_name || p.previous_owner_id}</td><td>${rosterOwnerMap[item.leagueId]?.[p.owner_id]?.display_name || p.owner_id}</td><td class="${direction === 'Received' ? 'text-success' : 'text-danger'}">${direction}</td></tr>`;
                    });
                    tableHtml += '</tbody></table>';
                    div.innerHTML = header + tableHtml;
                }

                div.dataset.players = tradedPlayers.join(' ');
                container.appendChild(div);
                allTradeItems.push(div);
            });

            const applyFilters = () => {
                const selectedLeague = leagueFilter.value;
                const searchQuery = document.getElementById('tradeSearch').value.toLowerCase().trim();
                allTradeItems.forEach(item => {
                    const leagueMatch = selectedLeague === 'all' || item.dataset.league === selectedLeague;
                    const playerMatch = searchQuery === '' || item.dataset.players.includes(searchQuery);
                    item.style.display = leagueMatch && playerMatch ? 'block' : 'none';
                });
            };

            leagueFilter.onchange = applyFilters;
            document.getElementById('tradeSearch').oninput = applyFilters;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
